<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 340px;
        margin: 0;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f1115;
        color: #e7e9ee;
      }
      .pad { padding: 14px; }
      input, button {
        font: inherit;
        width: 100%;
        box-sizing: border-box;
        border-radius: 6px;
        border: 1px solid #2a2f3a;
        background: #171a21;
        color: inherit;
        padding: 8px 10px;
      }
      button { cursor: pointer; margin-top: 8px; }
      button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
      .row { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #2a2f3a; }
      .row .meta { flex: 1; min-width: 0; }
      .row .title { font-weight: 600; }
      .row .sub { color: #98a1b2; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row button { width: auto; margin: 0; padding: 5px 9px; }
      .error { color: #ef4444; font-size: 12px; min-height: 16px; margin-top: 6px; }
      .muted { color: #98a1b2; }
      .actions { display: flex; gap: 8px; padding-top: 8px; }
      .actions button { margin-top: 0; }
      .totp {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 28px;
        letter-spacing: 2px;
        padding: 8px 0;
      }
      #root input[readonly] {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
