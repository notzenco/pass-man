[package]
name = "pm-core"
description = "Core vault format, cryptography, and data model for pass-man"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
rand.workspace = true
zeroize.workspace = true
rusqlite = { workspace = true, optional = true }
base64.workspace = true
uuid.workspace = true
time.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = []
# SQLite-backed vault file support. Disabled for WASM targets, where the
# extension uses the portable vault and sync record API instead.
storage = ["dep:rusqlite"]

[dev-dependencies]
tempfile = "3"
