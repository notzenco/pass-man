[package]
name = "pm-core-wasm"
description = "WASM bindings for the pass-man core, for browser extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pm-core.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde_json.workspace = true
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# `getrandom` needs the `js` backend to seed from crypto.getRandomValues on
# wasm32-unknown-unknown. Only pulled in for wasm builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
